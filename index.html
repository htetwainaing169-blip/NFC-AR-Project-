<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMBS AR Studio</title><style>body{margin:0;background:#101318;color:white;font:16px system-ui;text-align:center}header,main,footer{padding:20px}header img{width:min(260px,85%);background:white;border-radius:12px;padding:8px}video{width:100%;max-width:600px;border-radius:14px;background:#222}button,a{display:inline-block;padding:12px 18px;margin:8px;background:#75c743;color:#101318;border:0;border-radius:9px;font-weight:bold}small{color:#ccc}</style></head><body><header><img src="mmbs-logo.jpg" alt="MMBS Logo"><h1>MMBS AR STUDIO</h1></header><main><h2>Camera Test</h2><p>This is the first website test. Image tracking and AR recording are not enabled yet.</p><video id="camera" autoplay playsinline muted></video><br><button id="start">Open Camera</button><p id="status">Tap Open Camera to test your phone.</p><h3>Print Artwork</h3><img src="print-image.png" alt="Print target" style="width:min(85%,350px)"><h3>Animation Preview</h3><img src="animation.gif" alt="Animation" style="width:min(85%,350px)"></main><footer><a href="https://jiliomonm-wq.github.io/htet-wai-naing-portfolio1/" target="_blank" rel="noopener">Contact Developer</a></footer><script>document.getElementById('start').onclick=async()=>{try{let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});document.getElementById('camera').srcObject=s;document.getElementById('status').textContent='Camera is working.'}catch(e){document.getElementById('status').textContent='Camera unavailable: '+e.message}}</script></body></html>
