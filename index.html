
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MMBS AR Camera</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080b0e;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#ar-container {
  position: fixed;
  inset: 0;
}

#ar-container canvas {
  display: block;
}

.glass {
  background: rgba(255,255,255,.10);
  border: 1px solid rgba(255,255,255,.32);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 6px 30px rgba(0,0,0,.15);
}

.header {
  position: fixed;
  top: max(18px, env(safe-area-inset-top));
  left: 16px;
  right: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 10;
  pointer-events: none;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 13px;
  border-radius: 22px;
  pointer-events: auto;
}

.brand img {
  width: 68px;
  background: white;
  border-radius: 7px;
}

.brand span {
  font-size: 12px;
  letter-spacing: 2px;
  font-weight: bold;
}

.settings {
  color: white;
  text-decoration: none;
  padding: 15px;
  border-radius: 50%;
  pointer-events: auto;
}

.status {
  position: fixed;
  top: 19%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  padding: 12px 18px;
  border-radius: 30px;
  white-space: nowrap;
  font-size: 12px;
  letter-spacing: 1px;
  text-align: center;
}

.scanner {
  position: fixed;
  width: 72vw;
  height: 54vw;
  max-height: 40vh;
  left: 50%;
  top: 49%;
  transform: translate(-50%, -50%);
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 22px;
  pointer-events: none;
  z-index: 5;
  box-shadow: 0 0 40px rgba(255,255,255,.05);
}

.bottom {
  position: fixed;
  bottom: max(35px, env(safe-area-inset-bottom));
  left: 0;
  right: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
}

.hint {
  padding: 12px 20px;
  border-radius: 25px;
  font-size: 13px;
  text-align: center;
}

.shutter {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: 4px solid white;
  background: rgba(255,255,255,.18);
  padding: 6px;
}

.shutter::after {
  content: "";
  display: block;
  width: 100%;
  height: 100%;
  background: white;
  border-radius: 50%;
}

.footer {
  font-size: 11px;
  opacity: .8;
}

.footer a {
  color: white;
}
</style>
</head>

<body>

<div id="ar-container"></div>

<header class="header">
  <div class="brand glass">
    <img src="./mmbs-logo.jpg" alt="MMBS">
    <span>GLASS AR<br>CAMERA</span>
  </div>

  <a class="settings glass"
     href="https://jiliomonm-wq.github.io/htet-wai-naing-portfolio1/"
     target="_blank" rel="noopener">
    ☰
  </a>
</header>

<div class="status glass" id="status">
  INITIALIZING AR...
</div>

<div class="scanner" id="scanner"></div>

<div class="bottom">
  <div class="hint glass" id="hint">
    Point camera at printed artwork
  </div>

  <button class="shutter" id="shutter"
    aria-label="Capture" disabled
    title="Capture coming in next version">
  </button>

  <div class="footer">
    MMBS AR EXPERIENCE ·
    <a href="https://jiliomonm-wq.github.io/htet-wai-naing-portfolio1/">
      Developer
    </a>
  </div>
</div>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { MindARThree } from
"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js";

import { parseGIF, decompressFrames } from
"https://esm.sh/gifuct-js@2.1.2";

const status = document.getElementById("status");
const hint = document.getElementById("hint");
const scanner = document.getElementById("scanner");

function message(text) {
  status.textContent = text;
}

async function loadAnimatedTexture(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error("Animation file missing");

  const buffer = await response.arrayBuffer();
  const gif = parseGIF(buffer);
  const frames = decompressFrames(gif, true);

  const width = gif.lsd.width;
  const height = gif.lsd.height;

  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;

  let index = 0;
  let previous = null;
  let saved = null;
  let nextTime = 0;

  function drawFrame(frame) {
    if (previous) {
      if (previous.disposalType === 2) {
        ctx.clearRect(
          previous.dims.left,
          previous.dims.top,
          previous.dims.width,
          previous.dims.height
        );
      } else if (previous.disposalType === 3 && saved) {
        ctx.putImageData(saved, 0, 0);
      }
    }

    saved = frame.disposalType === 3
      ? ctx.getImageData(0, 0, width, height)
      : null;

    const patch = new ImageData(
      new Uint8ClampedArray(frame.patch),
      frame.dims.width,
      frame.dims.height
    );

    const temp = document.createElement("canvas");
    temp.width = frame.dims.width;
    temp.height = frame.dims.height;
    temp.getContext("2d").putImageData(patch, 0, 0);

    ctx.drawImage(
      temp,
      frame.dims.left,
      frame.dims.top
    );

    previous = frame;
    texture.needsUpdate = true;
  }

  drawFrame(frames[0]);

  return {
    texture,
    aspect: width / height,
    update(time) {
      if (time < nextTime) return;

      const frame = frames[index];
      drawFrame(frame);

      nextTime = time + Math.max(frame.delay || 100, 20);
      index = (index + 1) % frames.length;
    }
  };
}

async function startAR() {
  try {
    message("LOADING ANIMATION...");

    const animation =
      await loadAnimatedTexture("./animation.gif");

    message("STARTING CAMERA...");

    const mindarThree = new MindARThree({
      container: document.querySelector("#ar-container"),
      imageTargetSrc: "./targets.mind",
      maxTrack: 1,
      uiLoading: "no",
      uiScanning: "no"
    });

    const { renderer, scene, camera } = mindarThree;
    const anchor = mindarThree.addAnchor(0);

    const geometry = new THREE.PlaneGeometry(
      1,
      1 / animation.aspect
    );

    const material = new THREE.MeshBasicMaterial({
      map: animation.texture,
      transparent: true,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    const plane = new THREE.Mesh(geometry, material);
    plane.position.z = 0.01;
    anchor.group.add(plane);

    anchor.onTargetFound = () => {
      message("AR TRACKING ACTIVE");
      hint.textContent = "Artwork is alive!";
      scanner.style.opacity = "0";
    };

    anchor.onTargetLost = () => {
      message("SEARCHING FOR ARTWORK");
      hint.textContent = "Point camera at printed artwork";
      scanner.style.opacity = "1";
    };

    await mindarThree.start();

    message("SCAN PRINTED ARTWORK");

    renderer.setAnimationLoop(() => {
      animation.update(performance.now());
      renderer.render(scene, camera);
    });

  } catch (error) {
    console.error(error);
    message("AR ERROR");
    hint.textContent = error.message;
  }
}

startAR();
</script>

</body>
</html>
