<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MMBS AR Camera</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
* {box-sizing:border-box}
html,body {margin:0;width:100%;height:100%;overflow:hidden;background:#080a0d;font-family:Arial,sans-serif;color:#fff}
a-scene {position:fixed!important;inset:0!important;width:100%!important;height:100%!important}
.glass {background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 30px rgba(0,0,0,.12)}
.top {position:fixed;top:calc(env(safe-area-inset-top) + 16px);left:16px;right:16px;z-index:100;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.brand {display:flex;align-items:center;gap:10px;border-radius:22px;padding:8px 13px;pointer-events:auto}
.brand img {width:72px;background:#fff;border-radius:7px}
.brand span {font-size:12px;font-weight:bold;letter-spacing:2px;line-height:1.5}
.menu {color:#fff;text-decoration:none;padding:15px;border-radius:50%;pointer-events:auto}
.status {position:fixed;z-index:100;top:20%;left:50%;transform:translateX(-50%);padding:13px 18px;border-radius:30px;font-size:12px;white-space:nowrap;text-align:center}
.scan {position:fixed;z-index:20;width:72vw;height:54vw;max-height:40vh;left:50%;top:49%;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.4);border-radius:22px;pointer-events:none}
.bottom {position:fixed;z-index:100;bottom:calc(env(safe-area-inset-bottom) + 35px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:20px}
.hint {padding:12px 18px;border-radius:28px;font-size:13px;text-align:center}
.shutter {width:75px;height:75px;border:4px solid #fff;border-radius:50%;background:rgba(255,255,255,.15);padding:6px;opacity:.55}
.shutter:after {content:"";display:block;width:100%;height:100%;background:#fff;border-radius:50%}
.footer {font-size:11px;color:#ddd}
.footer a {color:white}
</style>
</head>
<body>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded>

  <a-assets timeout="30000">
    <img id="firstFrame" src="./print-image.png">
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-plane
      id="animationPlane"
      position="0 0 0.01"
      width="1"
      height="0.75"
      material="shader: flat; transparent: true; side: double">
    </a-plane>
  </a-entity>

</a-scene>

<div class="top">
  <div class="brand glass">
    <img src="./mmbs-logo.jpg" alt="MMBS">
    <span>GLASS AR<br>CAMERA</span>
  </div>
  <a class="menu glass"
    href="https://jiliomonm-wq.github.io/htet-wai-naing-portfolio1/"
    target="_blank" rel="noopener">☰</a>
</div>

<div class="status glass" id="status">LOADING AR...</div>
<div class="scan" id="scan"></div>

<div class="bottom">
  <div class="hint glass" id="hint">Allow camera access to scan artwork</div>
  <button class="shutter" disabled aria-label="Capture coming soon"></button>
  <div class="footer">
    MMBS AR EXPERIENCE ·
    <a href="https://jiliomonm-wq.github.io/htet-wai-naing-portfolio1/">Developer</a>
  </div>
</div>

<script>
const statusEl = document.getElementById("status");
const hintEl = document.getElementById("hint");
const scanEl = document.getElementById("scan");
const scene = document.querySelector("a-scene");
const target = document.getElementById("target");

function setStatus(text) {
  statusEl.textContent = text;
}

window.addEventListener("error", e => {
  setStatus("ERROR: " + (e.message || "Unknown error"));
});

window.addEventListener("unhandledrejection", e => {
  setStatus("ERROR: " + (e.reason?.message || "AR initialization failed"));
});

scene.addEventListener("loaded", () => {
  setStatus("STARTING CAMERA...");
});

scene.addEventListener("arReady", () => {
  setStatus("SCAN PRINTED ARTWORK");
  hintEl.textContent = "Point camera at the printed image";
});

scene.addEventListener("arError", () => {
  setStatus("AR CAMERA ERROR");
  hintEl.textContent = "Check camera permission and refresh";
});

target.addEventListener("targetFound", () => {
  setStatus("AR TRACKING ACTIVE");
  hintEl.textContent = "Artwork is alive!";
  scanEl.style.opacity = "0";
});

target.addEventListener("targetLost", () => {
  setStatus("SEARCHING FOR ARTWORK");
  hintEl.textContent = "Point camera at the printed image";
  scanEl.style.opacity = "1";
});

async function setupAnimation() {
  try {
    const response = await fetch("./animation.gif");
    if (!response.ok) throw new Error("animation.gif not found");

    const blob = await response.blob();
    const bitmap = await createImageBitmap(blob);

    const canvas = document.createElement("canvas");
    canvas.width = bitmap.width;
    canvas.height = bitmap.height;

    const ctx = canvas.getContext("2d");
    const plane = document.getElementById("animationPlane");

    const texture = new AFRAME.THREE.CanvasTexture(canvas);
    texture.colorSpace = AFRAME.THREE.SRGBColorSpace;

    plane.addEventListener("object3dset", () => {
      const mesh = plane.getObject3D("mesh");
      if (mesh) {
        mesh.material.map = texture;
        mesh.material.needsUpdate = true;
      }
    });

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(bitmap, 0, 0);
      texture.needsUpdate = true;
      requestAnimationFrame(update);
    }

    update();

  } catch (err) {
    console.error(err);
    hintEl.textContent = "Animation error: " + err.message;
  }
}

setupAnimation();
</script>
</body>
</html>
